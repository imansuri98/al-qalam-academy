# Al Qalam Academy — Nginx Site Config
# SSL handled by Cloudflare CDN — VPS listens HTTP only

# 1. Learner Portal (academy.alqalamlib.com) -> Port 3002
server {
    listen 80;
    server_name academy.alqalamlib.com;

    client_max_body_size 100M;

    # Fix: Supabase auth cookies produce large headers
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# 2. CMS Admin Studio (admin-academy.alqalamlib.com / academy-admin.alqalamlib.com) -> Port 3001
server {
    listen 80;
    server_name admin-academy.alqalamlib.com academy-admin.alqalamlib.com;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
